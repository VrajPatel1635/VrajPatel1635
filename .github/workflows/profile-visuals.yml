name: Generate Profile Visuals

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summary-cards:
    runs-on: ubuntu-latest
    name: Generate Summary Cards
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: VrajPatel1635
          BRANCH_NAME: main
          UTC_OFFSET: 5.5

  github-metrics:
    runs-on: ubuntu-latest
    name: Generate Coding Habits
    needs: summary-cards
    steps:
      - name: Coding Habits & Activity
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.habits.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_timezone: Asia/Kolkata
          config_theme: dark

  contribution-game:
    runs-on: ubuntu-latest
    name: Generate Contribution Game
    permissions:
      contents: write
    needs: summary-cards
    steps:
      - name: Generate Breakout contribution game
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          game: breakout
          game_theme: github-dark

      - name: Push game SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
