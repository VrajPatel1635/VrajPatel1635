<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" fill="none">
  <defs>
    <linearGradient id="accent-line" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="20%" stop-color="#58A6FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#58A6FF" stop-opacity="1"/>
      <stop offset="80%" stop-color="#58A6FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="quote-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6edf3"/>
      <stop offset="100%" stop-color="#b0b8c1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="220" rx="6" fill="#0d1117"/>
  <rect x="1" y="1" width="798" height="218" rx="5" fill="none" stroke="#161b22" stroke-width="1"/>

  <line x1="100" y1="50" x2="700" y2="50" stroke="url(#accent-line)" stroke-width="0.5">
    <animate attributeName="x1" values="200;100;200" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="600;700;600" dur="8s" repeatCount="indefinite"/>
  </line>

  <text x="400" y="72" text-anchor="middle" fill="#58A6FF" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="6" opacity="0.7">
    ✦
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="5s" repeatCount="indefinite"/>
  </text>

  <text x="400" y="108" text-anchor="middle" fill="url(#quote-gradient)" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-size="26" font-weight="400" font-style="italic" letter-spacing="1.5">
    "Walk slowly, but never backward."
    <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze"/>
  </text>

  <text x="400" y="138" text-anchor="middle" fill="#7d8590" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-size="11" font-weight="400" letter-spacing="0.5" opacity="0">
    — Abraham Lincoln
    <animate attributeName="opacity" values="0;0.7" dur="1.5s" begin="0.8s" fill="freeze"/>
  </text>

  <line x1="340" y1="155" x2="460" y2="155" stroke="url(#accent-line)" stroke-width="0.3" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1s" begin="1.2s" fill="freeze"/>
  </line>

  <text x="400" y="180" text-anchor="middle" fill="#7d8590" font-family="'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="400" letter-spacing="0.8" opacity="0">
    Building systems that matter — one commit at a time.
    <animate attributeName="opacity" values="0;0.6" dur="1.5s" begin="1.5s" fill="freeze"/>
  </text>

  <line x1="100" y1="200" x2="700" y2="200" stroke="url(#accent-line)" stroke-width="0.5">
    <animate attributeName="x1" values="200;100;200" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="600;700;600" dur="8s" repeatCount="indefinite"/>
  </line>
</svg>
